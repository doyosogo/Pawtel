name: PAWTEL CI
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true
# All credentials below are synthetic and confined to disposable CI containers.
# No repository/environment/provider secrets are supplied to pull-request code.
jobs:
  backend:
    name: backend-quality-and-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-bootstrap-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      DATABASE_URL: postgresql+psycopg://pawtel_ci:ci-app-only@127.0.0.1:5432/pawtel_ci
      TEST_DATABASE_URL: postgresql+psycopg://pawtel_test:ci-test-only@127.0.0.1:5432/pawtel_test
    defaults:
      run:
        working-directory: backend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - name: Install locked dependencies
        run: |
          python -m pip install -r requirements-dev.lock
          python -m pip install --no-deps -e .
      - name: Create guarded non-superuser databases
        env:
          PGPASSWORD: ci-bootstrap-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pawtel_ci LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-app-only';
          CREATE DATABASE pawtel_ci OWNER pawtel_ci;
          CREATE ROLE pawtel_test LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-test-only';
          CREATE DATABASE pawtel_test OWNER pawtel_test;
          REVOKE ALL ON DATABASE pawtel_ci, pawtel_test FROM PUBLIC;
          ALTER ROLE pawtel_ci SET timezone='UTC';
          ALTER ROLE pawtel_test SET timezone='UTC';
          SQL
      - name: Apply deployment and guarded test migrations
        run: |
          python -m alembic upgrade head
          python -m tools.migrate_test
          python -m alembic current
          python -m alembic check
      - name: Backend quality
        run: |
          python --version
          python -m ruff check .
          python -m ruff format --check .
          python -m pip check
      - name: Complete backend tests
        run: python -m pytest
  frontend:
    name: frontend-quality-and-tests
    runs-on: ubuntu-24.04
    # Browser installation and showcase execution must use the same project cache.
    env:
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/pw-browsers
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install locked dependencies
        run: npm ci
      - name: Frontend quality
        run: |
          npm run lint
          npm run format:check
      - name: Complete frontend tests
        run: npm test -- --run
      - name: TypeScript and production build
        run: npm run build
      - name: Install bundled Chromium for static showcase
        run: npx playwright install --with-deps chromium
      - name: Static showcase journeys without backend or providers
        run: npm run test:showcase
  e2e:
    name: e2e
    needs: [backend, frontend]
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6
        env:
          POSTGRES_PASSWORD: ci-e2e-bootstrap-only
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 5s --health-timeout 5s --health-retries 10
    env:
      APP_ENV: test
      E2E_DATABASE_URL: postgresql+psycopg://pawtel_e2e:ci-e2e-only@127.0.0.1:5432/pawtel_e2e
      PLAYWRIGHT_BROWSERS_PATH: ${{ github.workspace }}/.cache/pw-browsers
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.14"
          cache: pip
          cache-dependency-path: backend/requirements-dev.lock
      - uses: actions/setup-node@v6
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - name: Install backend
        working-directory: backend
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install -r requirements-dev.lock
          .venv/bin/python -m pip install --no-deps -e .
      - name: Create isolated E2E database
        env:
          PGPASSWORD: ci-e2e-bootstrap-only
        run: |
          psql -h 127.0.0.1 -U postgres -d postgres -v ON_ERROR_STOP=1 <<'SQL'
          CREATE ROLE pawtel_e2e LOGIN NOSUPERUSER NOCREATEDB NOCREATEROLE PASSWORD 'ci-e2e-only';
          CREATE DATABASE pawtel_e2e OWNER pawtel_e2e;
          REVOKE ALL ON DATABASE pawtel_e2e FROM PUBLIC;
          ALTER ROLE pawtel_e2e SET timezone='UTC';
          SQL
      - name: Install frontend and bundled headless Chromium
        working-directory: frontend
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Real frontend/API/PostgreSQL journeys
        working-directory: frontend
        run: npm run test:e2e
