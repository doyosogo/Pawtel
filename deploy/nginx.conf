# Example same-origin edge: adapt paths/server_name and terminate TLS before use.
# Place limit_req_zone directives in the http context. Keep backend loopback-only.
limit_req_zone $binary_remote_addr zone=pawtel_auth:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pawtel_checkout:10m rate=10r/m;
limit_req_zone $binary_remote_addr zone=pawtel_media:10m rate=6r/m;
log_format pawtel_safe escape=json
    '{"time":"$time_iso8601","method":"$request_method","status":$status,'
    '"duration":$request_time,"upstream_status":"$upstream_status",'
    '"request_id":"$upstream_http_x_request_id"}';
server {
    listen 127.0.0.1:8080;
    server_name pawtel.example.com;
    root /srv/pawtel/frontend/dist;
    client_max_body_size 64k;
    client_body_timeout 15s;
    limit_req_status 429;
    # No query strings, cookies, request bodies or auth headers in edge logs.
    access_log /var/log/nginx/pawtel-access.json pawtel_safe;
    # Avoid nginx error lines containing secret-bearing return URL query strings.
    error_log /dev/null;
    add_header X-Content-Type-Options nosniff always;
    add_header Referrer-Policy strict-origin-when-cross-origin always;
    add_header X-Frame-Options DENY always;
    add_header Permissions-Policy 'camera=(), microphone=(), geolocation=()' always;
    # Groundwork only: deliberately does not restrict Stripe frames/scripts/media.
    add_header Content-Security-Policy "frame-ancestors 'none'; base-uri 'self'; object-src 'none'" always;
    location ~ ^/api/v1/auth/(login|register|verify-email)$ {
        limit_req zone=pawtel_auth burst=5 nodelay;
        include /etc/nginx/pawtel-proxy.conf;
    }
    location ~ ^/api/v1/bookings/[0-9a-fA-F-]+/checkout-session$ {
        limit_req zone=pawtel_checkout burst=3 nodelay;
        include /etc/nginx/pawtel-proxy.conf;
    }
    location ~ ^/api/v1/host/listings/[0-9a-fA-F-]+/images$ {
        client_max_body_size 5m;
        limit_req zone=pawtel_media burst=2 nodelay;
        include /etc/nginx/pawtel-proxy.conf;
    }
    location = /api/v1/webhooks/stripe {
        client_max_body_size 1m;
        include /etc/nginx/pawtel-proxy.conf;
    }
    location /api/ { include /etc/nginx/pawtel-proxy.conf; }
    location = /health { include /etc/nginx/pawtel-proxy.conf; }
    location = /ready { include /etc/nginx/pawtel-proxy.conf; }
    location / { try_files $uri $uri/ /index.html; }
}
