[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "pawtel-backend"
version = "0.1.0"
description = "PAWTEL API foundation"
requires-python = ">=3.14,<3.15"
dependencies = [
    "fastapi>=0.143,<1",
    "uvicorn>=0.54,<1",
    "sqlalchemy>=2.1,<3",
    "alembic>=1.20,<2",
    "psycopg[binary]>=3.3,<4",
    "pydantic>=2.14,<3",
    "pydantic-settings>=2.15,<3",
]

[project.optional-dependencies]
dev = ["pytest>=9.1,<10", "httpx>=0.28,<1", "ruff>=0.17,<1"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: requires dedicated local PostgreSQL 18 pawtel_test database"]

[tool.ruff]
target-version = "py314"
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
